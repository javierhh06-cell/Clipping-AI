version: "3.8"

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: clips_db
    environment:
      POSTGRES_USER: clips_user
      POSTGRES_PASSWORD: clips_password_secure
      POSTGRES_DB: clips_virales_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clips_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clips_network

  # Redis (Celery Broker)
  redis:
    image: redis:7-alpine
    container_name: clips_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clips_network

  # Celery Worker (Renderizado)
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: clips_celery_worker
    command: celery -A celery_config worker -l info -Q videos --concurrency=2
    environment:
      DATABASE_URL: postgresql://clips_user:clips_password_secure@db:5432/clips_virales_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
      - /tmp/clips_virales:/tmp/clips_virales
    networks:
      - clips_network

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clips_api
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://clips_user:clips_password_secure@db:5432/clips_virales_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      DEBUG: "True"
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
    networks:
      - clips_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Flower (Celery Monitoring)
  flower:
    image: mher/flower:2.0
    container_name: clips_flower
    command: celery -A celery_config flower --port=5555 --broker=redis://redis:6379/1
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - redis
      - celery_worker
    networks:
      - clips_network

volumes:
  postgres_data:
  redis_data:

networks:
  clips_network:
    driver: bridge
